<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏰ TIME HUB · clock, stopwatch, timer & alarm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1b2e44, #0b1620);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .glass-panel {
            max-width: 1400px;
            width: 100%;
            background: rgba(20, 35, 50, 0.5);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 4rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 45px -20px black, inset 0 1px 2px rgba(255,255,255,0.1);
        }

        /* ----- main digital clock ----- */
        .main-clock {
            background: #0f1b27;
            border-radius: 3rem;
            padding: 2rem 2rem 1.8rem;
            margin-bottom: 3rem;
            border: 1px solid #2f5575;
            box-shadow: 0 15px 25px #00000060, inset 0 0 10px #27455c;
        }

        #liveTime {
            font-size: 5.5rem;
            font-weight: 600;
            font-family: 'Courier New', 'Fira Code', monospace;
            text-align: center;
            color: #aaf0ff;
            text-shadow: 0 0 10px #3fbfff, 0 0 20px #0077ff;
            letter-spacing: 6px;
            line-height: 1.2;
        }

        #liveDate {
            font-size: 1.7rem;
            text-align: center;
            color: #b8d6f0;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0.3rem;
            opacity: 0.9;
        }

        /* feature cards grid */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(15, 30, 45, 0.7);
            border-radius: 2.5rem;
            padding: 1.8rem 1.5rem;
            border: 1px solid #335577;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 18px #00000050;
            transition: all 0.15s;
        }

        .card:hover {
            border-color: #4c9aff;
            box-shadow: 0 0 15px #1e90ff40;
        }

        .card h2 {
            color: #c6e2ff;
            font-weight: 350;
            letter-spacing: 1.5px;
            border-bottom: 1px dashed #3c6885;
            padding-bottom: 0.5rem;
            margin-bottom: 1.8rem;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* displays inside cards */
        .display {
            background: #0a131e;
            border-radius: 2rem;
            padding: 1.5rem 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-family: 'Courier New', monospace;
            border: 1px solid #2c506e;
            box-shadow: inset 0 3px 8px black;
        }

        .stopwatch-display, .timer-display {
            font-size: 2.8rem;
            font-weight: 600;
            color: #e3f2ff;
            text-shadow: 0 0 6px #2aa0ff;
            letter-spacing: 4px;
        }

        .alarm-display {
            font-size: 2.4rem;
            color: #ffdeb3;
            text-shadow: 0 0 5px orange;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 1.5rem 0 0.5rem;
        }

        button, .btn {
            background: #1f3f5c;
            border: none;
            border-radius: 3rem;
            padding: 0.9rem 2rem;
            font-size: 1.2rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.1s ease;
            box-shadow: 0 5px 10px #00000040, inset 0 1px 2px #ffffff30;
            border: 1px solid #3979b0;
            min-width: 95px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 5px black;
        }

        button:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(60%);
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin: 1rem 0;
        }

        .input-group label {
            color: #b0d0f0;
            font-size: 1.3rem;
        }

        .input-group input {
            background: #102433;
            border: 1px solid #346792;
            border-radius: 2rem;
            padding: 0.8rem 1.2rem;
            font-size: 1.4rem;
            width: 90px;
            text-align: center;
            color: #dcf0ff;
            font-weight: 600;
            outline: none;
        }

        .input-group input:focus {
            border-color: #6ab0ff;
            box-shadow: 0 0 12px #007bff70;
        }

        .alarm-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            background: #0e1f2d;
            border-radius: 3rem;
            padding: 0.8rem;
            margin-top: 1rem;
        }

        .alarm-status {
            font-size: 1.5rem;
            color: #ffbe6e;
        }

        .ringing-indicator {
            color: #ff5e5e;
            font-weight: bold;
            animation: pulse 1s infinite;
            background: #420000;
            padding: 0.4rem 1.8rem;
            border-radius: 3rem;
        }

        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } }

        .footer-sound {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 25px;
            margin-top: 30px;
            color: #a0c0da;
        }

        #soundToggle {
            background: #2e4258;
            padding: 0.8rem 2.2rem;
            border-radius: 3rem;
            font-size: 1.3rem;
            border: 1px solid #7fa7c7;
        }
    </style>
</head>
<body>
<div class="glass-panel">
    <!-- main digital clock -->
    <div class="main-clock">
        <div id="liveTime">00:00:00</div>
        <div id="liveDate">Loading...</div>
    </div>

    <!-- three feature cards -->
    <div class="cards">
        <!-- STOPWATCH CARD -->
        <div class="card">
            <h2>⏱️ STOPWATCH</h2>
            <div class="display">
                <span id="stopwatchDisplay" class="stopwatch-display">00:00:00.00</span>
            </div>
            <div class="controls">
                <button id="startStopwatch">▶ Start</button>
                <button id="pauseStopwatch">⏸️ Pause</button>
                <button id="resetStopwatch">↺ Reset</button>
            </div>
        </div>

        <!-- TIMER CARD -->
        <div class="card">
            <h2>⏳ TIMER</h2>
            <div class="display">
                <span id="timerDisplay" class="timer-display">00:00:00</span>
            </div>
            <div class="input-group">
                <label>min</label>
                <input type="number" id="timerMinutes" min="0" max="99" value="1" step="1">
                <label>sec</label>
                <input type="number" id="timerSeconds" min="0" max="59" value="0" step="1">
                <button id="setTimerBtn">⚙️ Set</button>
            </div>
            <div class="controls">
                <button id="startTimer">▶ Start</button>
                <button id="pauseTimer">⏸️ Pause</button>
                <button id="resetTimer">↺ Reset</button>
            </div>
        </div>

        <!-- ALARM CARD -->
        <div class="card">
            <h2>⏰ ALARM</h2>
            <div class="display">
                <span id="alarmDisplay" class="alarm-display">--:--</span>
            </div>
            <div class="input-group">
                <label>HH</label>
                <input type="number" id="alarmHour" min="0" max="23" value="8" step="1">
                <label>MM</label>
                <input type="number" id="alarmMinute" min="0" max="59" value="0" step="1">
                <button id="setAlarmBtn">🔔 Set</button>
            </div>

            <div class="alarm-row">
                <span class="alarm-status">🔕 Armed</span>
                <label class="switch">
                    <input type="checkbox" id="alarmEnableCheckbox" checked>
                    <span class="toggle-slider"></span>
                </label>
                <button id="stopAlarmBtn" style="background:#8b3a3a;">🛑 Stop</button>
            </div>
            <div id="ringingIndicator" class="ringing-indicator" style="display: none;">🔔 RINGING</div>
        </div>
    </div>

    <!-- sound controller (required for alarm / timer beep) -->
    <div class="footer-sound">
        <span>🔊 sound engine</span>
        <button id="soundToggle">🔇 Init sound</button>
        <span id="soundStatus" style="color:#a0ffb0;">not ready</span>
    </div>
</div>

<script>
    (function() {
        // -------------------- AUDIO (web audio api) --------------------
        let audioCtx = null;
        let soundReady = false;
        const soundStatus = document.getElementById('soundStatus');
        const soundToggle = document.getElementById('soundToggle');

        function initAudio() {
            if (audioCtx) return Promise.resolve(audioCtx);
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx.resume().then(() => {
                soundReady = true;
                soundStatus.innerText = 'ready 🔊';
                soundStatus.style.color = '#a0ffb0';
                return audioCtx;
            }).catch(e => {
                console.warn('audio resume failed', e);
                soundReady = false;
                soundStatus.innerText = 'failed ❌';
            });
        }

        soundToggle.addEventListener('click', () => {
            initAudio().then(() => {
                // test beep
                beep(600, 120);
            });
        });

        function beep(freq = 700, duration = 200) {
            if (!audioCtx || audioCtx.state !== 'running') {
                console.log('audio not running, cannot beep');
                return;
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.value = 0.2;
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration / 1000);
            } catch (e) { /* fail silent */ }
        }

        // ---------- live clock (date & time) ----------
        const liveTimeEl = document.getElementById('liveTime');
        const liveDateEl = document.getElementById('liveDate');

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            liveTimeEl.innerText = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            liveDateEl.innerText = now.toLocaleDateString(undefined, options);
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ---------- STOPWATCH ----------
        let swInterval = null;
        let swRunning = false;
        let swCentiseconds = 0; // 1 cs = 10ms
        const swDisplay = document.getElementById('stopwatchDisplay');
        const startStopwatch = document.getElementById('startStopwatch');
        const pauseStopwatch = document.getElementById('pauseStopwatch');
        const resetStopwatch = document.getElementById('resetStopwatch');

        function formatStopwatch(cs) {
            const hours = Math.floor(cs / 360000);
            const minutes = Math.floor((cs % 360000) / 6000);
            const seconds = Math.floor((cs % 6000) / 100);
            const centi = cs % 100;
            return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(centi).padStart(2,'0')}`;
        }

        function updateStopwatchDisplay() {
            swDisplay.innerText = formatStopwatch(swCentiseconds);
        }

        startStopwatch.addEventListener('click', () => {
            if (swRunning) return;
            swRunning = true;
            if (swInterval) clearInterval(swInterval);
            swInterval = setInterval(() => {
                swCentiseconds += 1;
                updateStopwatchDisplay();
            }, 10);
        });

        pauseStopwatch.addEventListener('click', () => {
            if (swInterval) clearInterval(swInterval);
            swRunning = false;
        });

        resetStopwatch.addEventListener('click', () => {
            swRunning = false;
            if (swInterval) {
                clearInterval(swInterval);
                swInterval = null;
            }
            swCentiseconds = 0;
            updateStopwatchDisplay();
        });

        // ---------- TIMER ----------
        let timerInterval = null;
        let timerRunning = false;
        let timerTotalCs = 0;          // total centiseconds set
        let timerRemainingCs = 0;       // current countdown
        const timerDisplay = document.getElementById('timerDisplay');
        const timerMinutes = document.getElementById('timerMinutes');
        const timerSeconds = document.getElementById('timerSeconds');
        const setTimerBtn = document.getElementById('setTimerBtn');
        const startTimer = document.getElementById('startTimer');
        const pauseTimer = document.getElementById('pauseTimer');
        const resetTimer = document.getElementById('resetTimer');

        function formatTimer(cs) {
            if (cs < 0) cs = 0;
            const hours = Math.floor(cs / 360000);
            const minutes = Math.floor((cs % 360000) / 6000);
            const seconds = Math.floor((cs % 6000) / 100);
            return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.innerText = formatTimer(timerRemainingCs);
        }

        function setTimerFromInputs() {
            const mins = parseInt(timerMinutes.value) || 0;
            const secs = parseInt(timerSeconds.value) || 0;
            timerTotalCs = (mins * 60 + secs) * 100;
            timerRemainingCs = timerTotalCs;
            updateTimerDisplay();
        }
        setTimerFromInputs(); // initial

        setTimerBtn.addEventListener('click', () => {
            setTimerFromInputs();
            if (timerRunning) {
                // if timer was running, keep running with new total?
                // but we reset remaining to new total and continue countdown from there? better stop?
                // we'll just update total but keep remaining? let's set remaining = new total (reset)
                timerRemainingCs = timerTotalCs;
                updateTimerDisplay();
            } else {
                timerRemainingCs = timerTotalCs;
                updateTimerDisplay();
            }
        });

        function timerBeepAndStop() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerRunning = false;
            beep(880, 400);
            beep(680, 400); // double beep
        }

        startTimer.addEventListener('click', () => {
            if (timerRunning) return;
            if (timerRemainingCs <= 0) {
                setTimerFromInputs(); // reload from inputs if zero
            }
            timerRunning = true;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerRemainingCs > 0) {
                    timerRemainingCs -= 1; // 10ms step = 1 cs
                    updateTimerDisplay();
                    if (timerRemainingCs <= 0) {
                        timerRemainingCs = 0;
                        updateTimerDisplay();
                        timerBeepAndStop();
                    }
                } else {
                    timerBeepAndStop();
                }
            }, 10);
        });

        pauseTimer.addEventListener('click', () => {
            timerRunning = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        });

        resetTimer.addEventListener('click', () => {
            timerRunning = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerRemainingCs = timerTotalCs;
            updateTimerDisplay();
        });

        // ---------- ALARM ----------
        const alarmHour = document.getElementById('alarmHour');
        const alarmMinute = document.getElementById('alarmMinute');
        const setAlarmBtn = document.getElementById('setAlarmBtn');
        const alarmEnable = document.getElementById('alarmEnableCheckbox');
        const stopAlarmBtn = document.getElementById('stopAlarmBtn');
        const ringingIndicator = document.getElementById('ringingIndicator');
        const alarmDisplay = document.getElementById('alarmDisplay');

        let alarmTime = { hour: 8, minute: 0 };
        let alarmRinging = false;        // whether alarm is currently sounding
        let lastTriggerMinute = null;     // avoid repeated triggers within same minute

        function updateAlarmDisplay() {
            alarmDisplay.innerText = `${String(alarmTime.hour).padStart(2,'0')}:${String(alarmTime.minute).padStart(2,'0')}`;
        }
        updateAlarmDisplay();

        setAlarmBtn.addEventListener('click', () => {
            const h = parseInt(alarmHour.value) || 0;
            const m = parseInt(alarmMinute.value) || 0;
            alarmTime.hour = Math.min(23, Math.max(0, h));
            alarmTime.minute = Math.min(59, Math.max(0, m));
            updateAlarmDisplay();
        });

        // stop alarm button
        stopAlarmBtn.addEventListener('click', () => {
            alarmRinging = false;
            ringingIndicator.style.display = 'none';
            // also disarm checkbox? we keep armed but stop ringing
        });

        // every second check alarm condition
        setInterval(() => {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();

            // update alarm enable from checkbox
            const armed = alarmEnable.checked;

            if (armed && !alarmRinging) {
                if (currentHour === alarmTime.hour && currentMinute === alarmTime.minute) {
                    // avoid re-triggering same minute
                    if (lastTriggerMinute !== currentHour * 100 + currentMinute) {
                        lastTriggerMinute = currentHour * 100 + currentMinute;
                        alarmRinging = true;
                        ringingIndicator.style.display = 'inline-block';
                        // beep loop while ringing (every 2 seconds)
                        beep(750, 500);
                        const ringInterval = setInterval(() => {
                            if (!alarmRinging) {
                                clearInterval(ringInterval);
                                ringingIndicator.style.display = 'none';
                            } else {
                                beep(750, 400);
                            }
                        }, 2000);
                    }
                }
            } else {
                // reset last trigger when minute changes
                const currentMin = currentHour * 100 + currentMinute;
                if (lastTriggerMinute !== currentMin) {
                    // if alarm is turned off or condition not met, we can clear ringing if needed
                    if (!armed) {
                        alarmRinging = false;
                        ringingIndicator.style.display = 'none';
                    }
                }
            }
        }, 1000);

        // extra: if checkbox toggled off while ringing -> stop
        alarmEnable.addEventListener('change', () => {
            if (!alarmEnable.checked) {
                alarmRinging = false;
                ringingIndicator.style.display = 'none';
            }
        });

        // initialize alarm inputs
        alarmHour.value = 8;
        alarmMinute.value = 0;

        // prefill stopwatch and timer examples
        updateStopwatchDisplay();

        // minor: init sound on any button that may cause beep (alarm/timer)
        const beepButtons = [startTimer, setTimerBtn, setAlarmBtn, startStopwatch];
        beepButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!audioCtx) initAudio(); // attempt lazy init but resume needs user gesture, so soundToggle is explicit
            });
        });

        // ensure that soundToggle also updates status
    })();
</script>
<!-- a little extra style for toggle (didn't want to overcomplicate with extra switch, just using standard checkbox) -->
<style>
    .switch input {
        width: 40px;
        height: 20px;
        accent-color: #2f80ed;
        transform: scale(1.3);
        margin-left: 10px;
    }
    .alarm-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    #stopAlarmBtn {
        background: #a13d3d;
        font-size: 1.2rem;
        padding: 0.6rem 1.5rem;
    }
    #ringingIndicator {
        background: #a00000;
        color: white;
        font-weight: bold;
        padding: 0.5rem 1.2rem;
        border-radius: 3rem;
        text-align: center;
        margin-top: 0.5rem;
    }
    .footer-sound button {
        background: #2e5f73;
        font-size: 1.2rem;
        padding: 0.6rem 1.8rem;
    }
</style>
</body>
</html>
